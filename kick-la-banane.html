    if (tok === '.') { if (last && last[0] === 'R') last[1] += step; else out.push(['R', step]); continue; }

// ── the crowd: goths everywhere, plus a themed costume squad depending on the level you just beat ──
const CROWD_THEME = ['banana', 'lion', 'suit', 'rat', 'bear', 'astro'];
const CROWD = Array.from({ length: 30 }, (_, i) => ({ x: 8 + ((i * 37) % 31) * 16.3 + (i % 3) * 3, y: 238 + (i % 3) * 5, ph: i * 0.37, board: i % 2 === 0 }));
function drawCrowd() {
  const theme = G.level >= 0 && G.level < CROWD_THEME.length ? CROWD_THEME[G.level] : null;
  const list = CROWD.map((c, i) => ({ ...c, kind: theme && i % 2 === 1 ? theme : 'goth', i })).sort((a, b) => a.y - b.y);
  for (const c of list) drawPerson(c);
}
function drawPerson(c) {
  const { x, y, i, kind } = c, f = ((BEAT + c.ph * 0.1) % 1 + 1) % 1, beat = Math.floor(BEAT + c.ph * 0.1);
  const bob = Math.round(Math.sin(f * Math.PI) * 2), up = (beat + i) % 2;
  const skis = (col) => { rect(x - 5, y, 11, 1, col); rect(x + 5, y - 1, 1, 1, col); };
  const board = (col) => { rect(x - 5, y, 11, 2, col); rect(x - 5, y, 11, 1, shade(col, 1.3)); };
  const arms = (col, sx, sy, spread) => { const a = up ? -1 : 1; pline(sx - 1, sy, sx - spread, sy + a * 4, col); pline(sx + 3, sy, sx + 2 + spread, sy - a * 4, col); };
  switch (kind) {
    case 'goth': {
      const hair = ['#39FF14', '#FF2BD6', '#00F0FF', '#B44CFF'][i % 4], Y = y - bob;
      rect(x - 1, Y - 4, 1, 4, '#111'); rect(x + 1, Y - 4 + (up ? -1 : 0), 1, 4, '#111');
      rect(x - 2, Y - 11, 5, 7, '#141018'); rect(x - 2, Y - 11, 5, 1, hair);
      rect(x - 1, Y - 14, 3, 3, '#ECE6F6'); rect(x - 1, Y - 16, 3, 2, '#000'); rect(x, Y - 18, 1, 2, hair);
      for (const s of [-1, 1]) pline(x + 0.5 + s * 2, Y - 10, x + 0.5 + s * 4, Y - 10 + ((up ^ (s > 0)) ? -6 : 2), '#141018');
      rect(x + (up ? -4 : 4), Y - (up ? 17 : 9), 1, 2, hair);
      break; }
    case 'banana': {   // skiers in banana suits
      const Y = y - bob; skis('#C03020');
      rect(x - 1, Y - 3, 1, 3, '#2A2A2A'); rect(x + 1, Y - 3, 1, 3, '#2A2A2A');
      ell(x, Y - 9, 2, 6, '#3A2200'); ell(x, Y - 9, 2, 5, '#FFE600'); rect(x, Y - 15, 1, 2, '#6A4210'); rect(x - 1, Y - 10, 1, 1, '#000'); rect(x + 1, Y - 10, 1, 1, '#000');
      arms('#FFE600', x, Y - 8, 4); pline(x - 4, Y - 8 + (up ? -4 : 4), x - 5, y, '#8080A0');
      break; }
    case 'lion': {     // skiers in lion suits
      const Y = y - bob; skis('#3060C0');
      rect(x - 1, Y - 3, 1, 3, '#C06A10'); rect(x + 1, Y - 3, 1, 3, '#C06A10'); rect(x - 2, Y - 9, 5, 6, '#F09A30');
      ell(x, Y - 12, 4, 4, '#A04A08'); ell(x, Y - 12, 2, 2, '#FFC870'); rect(x - 1, Y - 12, 1, 1, '#000'); rect(x + 1, Y - 12, 1, 1, '#000');
      arms('#F09A30', x, Y - 8, 4); pline(x + 2, Y - 4, x + 5, Y - 7 + (up ? -2 : 0), '#C06A10'); rect(x + 5, Y - 8 + (up ? -2 : 0), 1, 1, '#A04A08');
      break; }
    case 'suit': {     // snowboarders in business suits
      const lean = Math.sin(BP * 0.5 + c.ph) * 1.5, Y = y - bob; board(['#FF3040', '#30C0F0', '#FFE600'][i % 3]);
      rect(x - 2 + lean, Y - 4, 1, 4, '#2A2A36'); rect(x + 2 + lean, Y - 4, 1, 4, '#2A2A36');
      rect(x - 2 + lean, Y - 10, 5, 6, '#3A3A4A'); rect(x + lean, Y - 10, 1, 4, '#FFFFFF'); rect(x + lean, Y - 9, 1, 3, '#D02030');
      rect(x - 1 + lean, Y - 13, 3, 3, '#F0C8A0'); rect(x - 1 + lean, Y - 14, 3, 1, '#3A2A20');
      pline(x - 2 + lean, Y - 9, x - 7 + lean, Y - 9 + (up ? -3 : 1), '#3A3A4A'); pline(x + 3 + lean, Y - 9, x + 8 + lean, Y - 9 + (up ? 1 : -3), '#3A3A4A');
      rect(x + 8 + lean, Y - 9 + (up ? 1 : -3), 2, 2, '#5A3A20');   // the briefcase, obviously
      break; }
    case 'rat': {      // skiers and snowboarders dressed as rats
      const Y = y - bob; if (c.board) board('#30E040'); else skis('#FF60C0');
      rect(x - 1, Y - 3, 1, 3, '#7A7A84'); rect(x + 1, Y - 3, 1, 3, '#7A7A84'); rect(x - 2, Y - 9, 5, 6, '#9A9AA4');
      rect(x - 1, Y - 12, 3, 3, '#9A9AA4'); rect(x - 2, Y - 14, 1, 2, '#FFA0C0'); rect(x + 2, Y - 14, 1, 2, '#FFA0C0'); rect(x, Y - 11, 1, 1, '#FF60A0');
      for (let k = 0; k < 6; k++) rect(x - 3 - k, Y - 4 + Math.round(Math.sin(T * 6 + k * 0.8 + c.ph) * 1.5), 1, 1, '#FFA0C0');
      arms('#9A9AA4', x, Y - 8, 4);
      break; }
    case 'bear': {     // polar bears doing backflips in place, on the beat
      const fl = ((BEAT / 2 + c.ph * 0.25) % 1 + 1) % 1, hop = Math.sin(fl * Math.PI) * 12;
      ctx.save(); ctx.translate(Math.round(x), Math.round(y - 7 - hop)); ctx.rotate(-fl * Math.PI * 2);
      rect(-3, -6, 7, 9, '#000'); rect(-2, -5, 5, 7, '#FFFFFF'); rect(-3, -9, 7, 4, '#000'); rect(-2, -8, 5, 3, '#FFFFFF'); rect(-2, -10, 1, 1, '#FFFFFF'); rect(2, -10, 1, 1, '#FFFFFF');
      rect(0, -7, 1, 1, '#000'); rect(-1, 3, 1, 2, '#FFFFFF'); rect(1, 3, 1, 2, '#FFFFFF');
      ctx.restore();
      if (fl < 0.06 || fl > 0.94) rect(x - 3, y, 7, 1, '#E8E0F0');   // landing puff
      break; }
    case 'astro': {    // astronauts, low-gravity hopping
      const hop = Math.round(Math.abs(Math.sin(BP * 0.5 + c.ph)) * 5), Y = y - hop;
      rect(x - 1, Y - 3, 1, 3, '#DDDDE8'); rect(x + 1, Y - 3, 1, 3, '#DDDDE8'); rect(x - 2, Y - 9, 5, 6, '#F4F4FA'); rect(x + 3, Y - 9, 2, 5, '#9A9AA8');
      rect(x - 2, Y - 13, 5, 4, '#F4F4FA'); rect(x - 1, Y - 12, 3, 2, '#FFC830'); rect(x, Y - 7, 1, 1, '#30A0FF');
      arms('#F4F4FA', x, Y - 8, 4);
      if (i % 4 === 1) { rect(x - 6, Y - 18, 1, 9, '#C8C8D0'); rect(x - 5, Y - 18, 5, 3, '#E8242C'); rect(x - 3, Y - 18, 1, 3, '#FFFFFF'); }
      break; }
  }
}

function setScene(s) { G.scene = s; G.sceneT = 0; UI.focus = 0; }
// points belong to a single run: bank the best score, then empty the wallet (skins are kept)
function endRun() {
  const total = Save.d.wallet + (G.scene === 'PLAY' ? G.levelPts : 0);
  Save.d.best = Math.max(Save.d.best || 0, total); Save.d.wallet = 0; Save.save();
}
// "reset memory": wipe skins, points, unlocked levels (sound settings are kept)
function resetMemory() {
  const keep = { muted: Save.d.muted, musicOff: Save.d.musicOff, sfxOff: Save.d.sfxOff };
  Save.d = Object.assign({ wallet: 0, owned: ['classic'], skin: 'classic', best: 0, maxLevel: 1, runs: 0 }, keep);
  Save.save(); UI.resetArm = 0; Audio.sfx('rewind'); UI.focus = 0;
}
function goTitle() { endRun(); setScene('TITLE'); G.conf = []; G.paused = false; Audio.playMusic('title'); }

// ══════════════════════════════════════════════════════════════════
//  LANGUAGES — Français (default) · 日本語 · Italiano · English
//  Text is translated where it's drawn/measured: tr(englishString).
//  Exact phrases come from DICT; strings with numbers/names use PAT templates.

    'CHANGING OUTFITS? VERY FASHION.': 'お着替え？とてもファッション。', 'OOH. THAT ONE. GOOD CHOICE.': 'おお、それか。いい選択だ。', 'A NEW YOU! SAME BANANA.': '新しいきみ！同じバナナ。',
    'BEHOLD MY PEELS. ALL HAND-MADE. BY HANDS.': 'わたしの皮コレクションを見よ。ぜんぶ手作り。手で。', 'WHICH YOU WILL YOU BE TODAY?': '今日はどのきみになる？',

// strings with numbers or names inside — groups are translated recursively
const PAT = [
  [/^BEST RUN: (.+)$/, { fr: 'MEILLEURE PARTIE: $1', it: 'RECORD: $1', ja: 'ベスト：$1' }],
  [/^BANK: (.+)$/, { fr: 'BANQUE: $1', it: 'BANCA: $1', ja: 'ちょきん：$1' }],
  [/^FINAL SCORE: (.+)$/, { fr: 'SCORE FINAL: $1', it: 'PUNTEGGIO FINALE: $1', ja: 'さいしゅうスコア：$1' }],
  [/^LEVEL (\d+) NEXT$/, { fr: 'PROCHAIN: NIVEAU $1', it: 'PROSSIMO: LIVELLO $1', ja: 'つぎはステージ$1' }],
  [/^LEVEL (\d+)$/, { fr: 'NIVEAU $1', it: 'LIVELLO $1', ja: 'ステージ $1' }],
  [/^KEYS 1-(\d+): WARP$/, { fr: 'TOUCHES 1-$1: RACCOURCI', it: 'TASTI 1-$1: SALTA LIVELLO', ja: '1〜$1キー：ワープ' }],
  [/^(.+) CLEARED$/, { fr: '$1: RÉUSSI!', it: '$1 COMPLETATO!', ja: '$1 クリア！' }],

  [/^ZONE (\d+)\/6 · (.+)$/, { fr: 'ZONE $1/6 · $2', it: 'ZONA $1/6 · $2', ja: 'ゾーン$1/6・$2' }],
  [/^ZONE (\d+) \/ 6$/, { fr: 'ZONE $1 / 6', it: 'ZONA $1 / 6', ja: 'ゾーン $1／6' }],
  [/^NEXT: (.+)  \(\+1 HEART\)$/, { fr: 'ENSUITE: $1  (+1 COEUR)', it: 'PROSSIMA: $1  (+1 CUORE)', ja: 'つぎ：$1（ハート＋1）' }],
  [/^-(\d+) POINTS · INVINCIBLE 1S$/, { fr: '-$1 POINTS · INVINCIBLE 1 S', it: '-$1 PUNTI · INVINCIBILE 1 S', ja: '－$1ポイント・1秒むてき' }],
  [/^LEVEL POINTS LOST: -(\d+)$/, { fr: 'POINTS DU NIVEAU PERDUS: -$1', it: 'PUNTI DEL LIVELLO PERSI: -$1', ja: 'ステージのポイント －$1' }],

let TR_CACHE = new Map(), TR_LANG = null;
function tr(s) {
  s = String(s);

  if (L !== TR_LANG) { TR_CACHE = new Map(); TR_LANG = L; }
  const hit = TR_CACHE.get(s); if (hit !== undefined) return hit;
  let out = s;
  const d = DICT[L];
  if (d && d[s] !== undefined) out = d[s];
  else if (L !== 'en') for (const [re, tpl] of PAT) { const m = re.exec(s); if (m && tpl[L]) { out = tpl[L].replace(/\$(\d)/g, (_, k) => tr(m[+k])); break; } }

// ── text engine: bitmap Latin + crisp pixel Japanese ──
const JP_FONT = '"DotGothic16","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP","MS Gothic",sans-serif';
let JP_CACHE = new Map();
const isBmp = (ch) => FIDX[ch] !== undefined || FIDX[ch.toUpperCase()] !== undefined || ACC[ch.toUpperCase()] !== undefined;
const jpSize = (sc) => Math.round(7 * sc + 3);
const adv = (ch, sc) => (isBmp(ch) ? 6 * sc : jpSize(sc) + Math.max(1, sc));
function jpGlyph(ch, col, s) {
  const key = ch + '|' + col + '|' + s; let g = JP_CACHE.get(key); if (g) return g;
  const n = s + 4; g = document.createElement('canvas'); g.width = n; g.height = n;
  const x = g.getContext('2d'); x.font = `${s}px ${JP_FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = col; x.fillText(ch, n / 2, n / 2 + 1);
  const im = x.getImageData(0, 0, n, n), d = im.data, c = parseInt(col.slice(1, 7), 16) || 0;
  for (let i = 0; i < d.length; i += 4) { const on = d[i + 3] >= 100; d[i] = c >> 16 & 255; d[i + 1] = c >> 8 & 255; d[i + 2] = c & 255; d[i + 3] = on ? 255 : 0; }
  x.putImageData(im, 0, 0);
  if (JP_CACHE.size > 4000) JP_CACHE.clear();
  JP_CACHE.set(key, g); return g;
}
if (document.fonts && document.fonts.load) {   // when the pixel JP font arrives, re-render glyphs with it
  document.fonts.load('16px "DotGothic16"', 'あア漢').then(() => { JP_CACHE = new Map(); }).catch(() => { });
  document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => { JP_CACHE = new Map(); });
}
function rawW(s, sc) { let w = 0; for (const ch of s) w += adv(ch, sc); return Math.max(0, w - sc); }
function textW(s, sc = 1) { return rawW(tr(s), sc); }
function drawText(s, x, y, sc = 1, col = '#fff', o = {}) {
  s = tr(s);
  const w = rawW(s, sc);
  let px = Math.round(o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x), i = 0;
  for (const ch0 of s) {
    const dy = o.dance ? Math.round(Math.sin(BP * (o.speed || 1) + i * 0.7) * o.dance) : 0;
    const c = o.cycle ? o.cycle[(i + Math.floor(T * 8)) % o.cycle.length] : col, py = Math.round(y + dy);
    if (isBmp(ch0)) {
      const ch = normCh(ch0);
      if (ch !== ' ') {
        const gi = FIDX[ch];
        if (o.shadow) ctx.drawImage(fontAtlas(o.shadow), gi * 6, 0, 5, 7, px + sc, py + sc, 5 * sc, 7 * sc);
        ctx.drawImage(fontAtlas(c), gi * 6, 0, 5, 7, px, py, 5 * sc, 7 * sc);
      }
    } else {
      const s2 = jpSize(sc), gy = py - Math.round((s2 - 7 * sc) / 2) - 2;
      if (o.shadow) ctx.drawImage(jpGlyph(ch0, o.shadow, s2), px - 2 + sc, gy + sc);
      ctx.drawImage(jpGlyph(ch0, c, s2), px - 2, gy);
    }
    px += adv(ch0, sc); i++;
  }
}
// width-based wrapping: words for Latin, any character for Japanese (no line may start with 、。！？…)
function wrapPx(text, maxW, sc) {
  text = tr(text);
  const toks = text.match(/[　-鿿＀-￯]|[^\s　-鿿＀-￯]+|\s+/g) || [];
  const lines = []; let cur = '';
  for (const t of toks) {
    if (/^\s+$/.test(t)) { if (cur) cur += ' '; continue; }
    const cand = cur + t;
    if (rawW(cand.trim(), sc) > maxW && cur.trim()) {
      if (/^[、。！？…）」』,.!?]$/.test(t)) { cur = cand; continue; }
      lines.push(cur.trim()); cur = t;
    } else cur = cand;
  }
  if (cur.trim()) lines.push(cur.trim());

}
function wrapText(s, maxChars) { return wrapPx(s, maxChars * 6, 1); }
function say(t) { M.text = tr(t); M.shown = 0; }
// speech bubble with typewriter reveal across pre-wrapped lines
function drawBubbleS(x, y, w, text, shown, tailX, tailY, sc) {
  text = tr(text);
  const lines = wrapPx(text, w - 16, sc), lh = Math.max(11 * sc, jpSize(sc) + 3), h = lines.length * lh + 10 + 4 * sc;
  rectO(x, y, w, h, '#FFFFFF', '#000', 2);
  for (let i = 0; i < 6; i++) rect(lerp(x + w * 0.7, tailX, i / 6) - 4, lerp(y + h, tailY, i / 6), 8 - i, 3, '#FFFFFF');
  let left = Math.floor(shown);
  lines.forEach((l, i) => { if (left <= 0) return; const chars = [...l], part = chars.slice(0, left).join(''); left -= chars.length; drawText(part, x + 8, y + 6 + 2 * sc + i * lh, sc, '#000'); });
  if (shown >= [...text].length && Math.floor(T * 3) % 2) rect(x + w - 6 - 5 * sc, y + h - 4 - 5 * sc, 5 * sc, 5 * sc, '#000');
  return h;
}
function drawBubble(x, y, w, text, shown, tailX, tailY) { return drawBubbleS(x, y, w, text, shown, tailX, tailY, 1); }

// ── the flag button (title screen, top-right): FR → JA → IT → EN ──
const UK_FLAG = mk(['wllllwrwllllw', 'lwlllwrwlllwl', 'llwllwrwllwll', 'wwwwwwrwwwwww', 'rrrrrrrrrrrrr', 'wwwwwwrwwwwww', 'llwllwrwllwll', 'lwlllwrwlllwl', 'wllllwrwllllw'], { ...FLAG_PAL, l: '#1A2E7A' });
